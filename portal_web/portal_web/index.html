<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجموعة الكيان | AL KAYAN GROUP - نظام إدارة المواعيد والباقات الذكي</title>
  
  <!-- Unregister any conflicting mobile ServiceWorkers on Desktop Dashboard -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      }).catch(function() {});
    }
  </script>

  <!-- Google Fonts: Cairo & Tajawal for Ultra Crisp Arabic Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS: Local Fast Cache with CDN Fallback -->
  <script src="vendor/tailwindcss.js?v=4.0"></script>
  <script>
    if (typeof tailwind === 'undefined') {
      document.write('<script src="https://cdn.tailwindcss.com"><\/script>');
    }
  </script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            cairo: ['Cairo', 'Tajawal', 'sans-serif'],
          },
          colors: {
            gold: {
              50: '#FCF9F2',
              100: '#F7EEDC',
              200: '#EEDBB9',
              300: '#E4C691',
              400: '#D9B167',
              500: '#C5A059',
              600: '#AC863F',
              700: '#876728',
              800: '#62491B',
              900: '#413010',
              950: '#261B07',
            },
            luxury: {
              dark: '#0e0b08',
              card: 'rgba(24, 18, 14, 0.88)',
              border: 'rgba(212, 175, 99, 0.25)',
              gold: '#D4AF63',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel: Local Ultra-Fast Zero-Latency Load with CDN Fallbacks -->
  <script src="vendor/react.production.min.js"></script>
  <script>
    if (typeof React === 'undefined') {
      document.write('<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"><\/script>');
    }
  </script>

  <script src="vendor/react-dom.production.min.js"></script>
  <script>
    if (typeof ReactDOM === 'undefined') {
      document.write('<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"><\/script>');
    }
  </script>

  <script src="vendor/babel.min.js"></script>
  <script>
    if (typeof Babel === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"><\/script>');
    }
  </script>

  <!-- SheetJS (xlsx): Local Fast Cache with CDN Fallback -->
  <script src="vendor/xlsx.full.min.js"></script>
  <script>
    if (typeof XLSX === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>');
    }
  </script>

  <style>
    body {
      font-family: 'Cairo', 'Tajawal', sans-serif;
      background: radial-gradient(circle at 50% 20%, rgba(28, 21, 16, 0.82) 0%, rgba(17, 13, 9, 0.94) 65%, rgba(10, 7, 5, 0.98) 100%), url('alkayan_bg.jpg') center/cover fixed no-repeat;
      color: #f1f5f9;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
    }

    /* Luxury Golden Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 11, 8, 0.9);
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(to bottom, #C5A059, #876728);
      border-radius: 6px;
      border: 1px solid rgba(245, 238, 220, 0.2);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #D9B167;
    }

    /* Luxury Glassmorphism Card Style */
    .glass-card {
      background: rgba(22, 16, 12, 0.86);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 99, 0.22);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .glass-card-subtle {
      background: rgba(30, 22, 17, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 175, 99, 0.16);
    }

    .glass-card-bright {
      background: rgba(255, 255, 255, 0.96);
      color: #0f172a;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    /* Gold Metallic Shimmer Effect */
    .gold-gradient-btn {
      background: linear-gradient(135deg, #D9B167 0%, #C5A059 50%, #AC863F 100%);
      color: #1a1207;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 245, 220, 0.4);
      box-shadow: 0 10px 20px -5px rgba(197, 160, 89, 0.35);
      transition: all 0.2s ease;
    }
    .gold-gradient-btn:hover {
      background: linear-gradient(135deg, #E4C691 0%, #D9B167 50%, #C5A059 100%);
      box-shadow: 0 12px 25px -5px rgba(217, 177, 103, 0.5);
      transform: translateY(-1px);
    }
    .gold-gradient-btn:active {
      transform: translateY(0px) scale(0.98);
    }

    /* Gold Text Gradient */
    .gold-text-gradient {
      background: linear-gradient(135deg, #FFF0D0 0%, #D9B167 40%, #C5A059 80%, #876728 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Pulse glow for active backup indicator */
    @keyframes pulse-glow {
      0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 8px rgba(212, 175, 99, 0.6)); }
      50% { opacity: 0.7; transform: scale(1.08); filter: drop-shadow(0 0 14px rgba(212, 175, 99, 0.9)); }
    }
    .animate-pulse-glow {
      animation: pulse-glow 2.5s infinite ease-in-out;
    }

    /* Modal Backdrop Blur */
    .modal-backdrop {
      background-color: rgba(10, 7, 5, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-gold-500 selection:text-stone-950 font-cairo">
  <div id="root">
    <!-- Initial Fast Luxury Loading State -->
    <div class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
      <div class="glass-card p-8 rounded-3xl border border-amber-500/30 max-w-md w-full shadow-2xl flex flex-col items-center space-y-4">
        <div class="w-14 h-14 rounded-full border-4 border-amber-500/20 border-t-amber-400 animate-spin"></div>
        <h2 class="text-xl font-black text-white">مجموعة الكيان | AL KAYAN GROUP</h2>
        <p class="text-xs font-bold text-amber-300">الكيان يبدأ من كيان له كيان</p>
        <p class="text-[11px] text-stone-400">جاري فتح وتجهيز النظام...</p>
      </div>
    </div>
  </div>

  <div id="error-fallback" style="display: none;" class="fixed inset-0 z-50 bg-stone-950/95 flex items-center justify-center p-6 text-right" dir="rtl">
    <div class="glass-card p-6 rounded-3xl border-2 border-rose-500/60 max-w-lg w-full text-white space-y-3">
      <h3 class="text-base font-black text-rose-400">تنبيه أثناء التحميل:</h3>
      <p id="error-text" class="text-xs text-stone-300 font-mono bg-stone-900 p-3 rounded-xl border border-rose-500/30"></p>
      <button onclick="window.location.reload()" class="gold-gradient-btn text-stone-950 font-black text-xs px-4 py-2 rounded-xl">إعادة المحاولة 🔄</button>
    </div>
  </div>

  <script>
    window.addEventListener('error', function(e) {
      var errBox = document.getElementById('error-fallback');
      var errText = document.getElementById('error-text');
      if (errBox && errText && document.getElementById('root').children.length > 0) {
        if (document.querySelector('.min-h-screen.flex.flex-col.items-center.justify-center')) {
          errText.innerText = e.message || 'خطأ في تشغيل السكربت';
          errBox.style.display = 'flex';
        }
      }
    });
  </script>

  <!-- Main Application Script (Pre-compiled for Instant Zero-Latency Startup) -->
  <script src="app.compiled.js?v=19"></script>
  <script>
    // ⚡ Automatic Live Reload Sentinel for Desktop App & Admin Dashboard
    (function initDesktopAutoUpdater() {
      var currentAppTag = null;
      var isUpdating = false;

      function checkAppVersion() {
        if (isUpdating) return;

        fetch('./version.json?_t=' + Date.now(), { cache: 'no-store' })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data && (data.version || data.updatedAt)) {
              var tag = String(data.version || data.updatedAt);
              if (currentAppTag === null) {
                currentAppTag = tag;
              } else if (currentAppTag !== tag) {
                currentAppTag = tag;
                isUpdating = true;
                console.log('⚡ Desktop App version updated! Auto-reloading...');
                window.location.reload(true);
              }
            }
          })
          .catch(function() {
            fetch('./app.compiled.js?v=19&_t=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
              .then(function(res) {
                var tag = res.headers.get('etag') || res.headers.get('last-modified') || res.headers.get('content-length');
                if (tag) {
                  if (currentAppTag === null) {
                    currentAppTag = tag;
                  } else if (currentAppTag !== tag) {
                    currentAppTag = tag;
                    isUpdating = true;
                    console.log('⚡ Desktop App code updated! Auto-reloading...');
                    window.location.reload(true);
                  }
                }
              })
              .catch(function() {});
          });
      }

      setInterval(checkAppVersion, 3500);
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') checkAppVersion();
      });
      window.addEventListener('focus', checkAppVersion);
    })();

    // ========================================================
    // 🛑 Desktop Lifecycle & Clean Background Shutdown Controller
    // ========================================================
    (function initDesktopLifecycle() {
      var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      if (!isLocal) return;

      // 1. Send periodic heartbeat to keep backend and background processes alive while window is open
      function sendHeartbeat() {
        fetch('/api/heartbeat', { method: 'GET', cache: 'no-store' }).catch(function() {});
      }
      sendHeartbeat();
      setInterval(sendHeartbeat, 3000);

      // 2. On window close or navigate away, tell backend to cleanly shut down all background processes
      function notifyShutdown() {
        if (navigator.sendBeacon) {
          navigator.sendBeacon('/api/window_closing', '');
        } else {
          fetch('/api/window_closing', { method: 'POST', keepalive: true }).catch(function() {});
        }
      }

      window.addEventListener('beforeunload', notifyShutdown);
      window.addEventListener('pagehide', notifyShutdown);
    })();
  </script>

</body>
</html>
