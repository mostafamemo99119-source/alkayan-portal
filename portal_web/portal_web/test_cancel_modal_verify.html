  <!-- 🚀 PWA 24/7 Offline & Instant Zero-Intervention Auto-Updating Engine -->
  <script>
    (function initMobileAutoUpdater() {
      var currentVersionTag = null;
      var isUpdating = false;

      function triggerInstantReload(reason) {
        if (isUpdating) return;
        isUpdating = true;
        console.log('⚡ [AUTO-UPDATE] Triggered reload:', reason);
        
        try {
          var toast = document.createElement('div');
          toast.style.cssText = 'position:fixed;top:16px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#D9B167,#C5A059);color:#1a1207;padding:12px 24px;border-radius:22px;font-weight:900;font-size:12px;z-index:99999999;box-shadow:0 14px 35px rgba(0,0,0,0.85);border:2px solid #fff;display:flex;align-items:center;gap:10px;font-family:Cairo,sans-serif;';
          toast.innerHTML = '<span style="font-size:18px;">⚡</span><span>تم تحديث تطبيق الكيان! جاري تطبيق النسخة الجديدة فورياً...</span>';
          document.body.appendChild(toast);
        } catch(e) {}

        // Skip waiting in ServiceWorker and clear all old caches
        if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({ type: 'SKIP_WAITING' });
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) { return caches.delete(k); }));
            }).catch(function() {});
          }
        }

        setTimeout(function() {
          window.location.reload(true);
        }, 400);
      }

      // 1. ServiceWorker Controller Change & Broadcast Listener
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          triggerInstantReload('ServiceWorker Controller Changed');
        });

        navigator.serviceWorker.addEventListener('message', function(e) {
          if (e.data && (e.data.type === 'APP_VERSION_UPDATED' || e.data.type === 'VERSION_UPDATED')) {
            triggerInstantReload('ServiceWorker Broadcast Message');
          }
        });

        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js').then(function(reg) {
            reg.update();
            setInterval(function() { reg.update(); }, 6000);

            reg.addEventListener('updatefound', function() {
              var newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', function() {
                  if (newWorker.state === 'installed') {
                    if (navigator.serviceWorker.controller) {
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                      triggerInstantReload('New Worker Installed');
                    }
                  }
                });
              }
            });
          }).catch(function(err) {});
        });
      }

      // 2. High-Frequency Version & Asset Sentinel (Every 3.5s & on Tab Resume)
      function checkAssetVersion() {
        if (isUpdating) return;
        
        // A. Primary: Check version.json
        fetch('./version.json?_t=' + Date.now(), { cache: 'no-store' })
          .then(function(res) { return res.json(); })
          .then(function(data) {
            if (data && (data.version || data.updatedAt)) {
              var tag = String(data.version || data.updatedAt);
              if (currentVersionTag === null) {
                currentVersionTag = tag;
              } else if (currentVersionTag !== tag) {
                currentVersionTag = tag;
                triggerInstantReload('version.json updated to ' + tag);
              }
            }
          })
          .catch(function() {
            // B. Fallback: Check compiled script HEAD
            fetch('./mobile_app.compiled.js?_t=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
              .then(function(res) {
                var tag = res.headers.get('etag') || res.headers.get('last-modified') || res.headers.get('content-length');
                if (tag) {
                  if (currentVersionTag === null) {
                    currentVersionTag = tag;
                  } else if (currentVersionTag !== tag) {
                    currentVersionTag = tag;
                    triggerInstantReload('mobile_app.compiled.js HEAD Tag Changed');
                  }
                }
              })
              .catch(function() {});
          });
      }

      // Initial asset check
      checkAssetVersion();
      // Real-time interval check every 3.5s
      setInterval(checkAssetVersion, 3500);
      // Check on resume / focus / online
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          if (navigator.serviceWorker && navigator.serviceWorker.controller) {
            navigator.serviceWorker.getRegistration().then(function(reg) { if (reg) reg.update(); });
          }
          checkAssetVersion();
        }
      });
      window.addEventListener('focus', checkAssetVersion);
      window.addEventListener('online', checkAssetVersion);
    })();
